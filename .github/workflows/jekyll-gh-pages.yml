# Builds the deliverables (the rollup bundles), commits them back to main when a polyfill
# change alters them, and deploys the site to GitHub Pages.
name: Build bundles and deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the rebuilt bundles
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rollup/package-lock.json

      - name: Install build tools
        working-directory: rollup
        run: npm ci

      - name: Type-check polyfills
        working-directory: rollup
        # Report-only here so a type error never stops the site from deploying.
        # The "Check polyfills" workflow fails pull requests that have type errors.
        continue-on-error: true
        run: npm run typecheck

      - name: Build bundles
        working-directory: rollup
        run: npm run build

      # Commits made with the workflow's token don't start another workflow run, so this doesn't loop.
      # The site below is built from these same files, so it is current either way.
      # Only in the W3C repository: in a fork, a bot commit on main would block the owner's next push.
      - name: Commit rebuilt bundles
        if: github.repository == 'w3c/mathml-polyfills' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- rollup/allpolyfillsbundle*.js; then
            echo "Bundles are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rollup/allpolyfillsbundle*.js
          git commit -m "Rebuild rollup bundles for ${GITHUB_SHA::7}"
          git push || echo "::warning::Could not push the rebuilt bundles. If main has moved on, the run for that push rebuilds them."

      - name: Keep build tools out of the site
        run: rm -rf rollup/node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
