<!DOCTYPE html>
<!-- See the file ./LICENSE.txt for the LICENSE of this file. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MathML polyfill demo</title>
  <link rel="stylesheet" href="./menclose/menclose.css">
  <script>
    // all-polyfills.js treats this value as "run on load". false skips that pass
    // so this page can transform only the pasted MathML.
    window.doNotRunTransformsOnPageLoad = false;
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --text: #1c1c1c;
      --muted: #555;
      --line: #c8c8c8;
      --panel: #fff;
      --page: #f3f4f6;
      --accent: #0b57d0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f2f2f2;
        --muted: #b5b5b5;
        --line: #444;
        --panel: #1e1e1e;
        --page: #121212;
        --accent: #8ab4f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--page);
      line-height: 1.45;
    }
    header, main {
      width: min(1100px, calc(100% - 2rem));
      margin-inline: auto;
    }
    header { padding: 1.5rem 0 0.5rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.4rem; }
    p { margin: 0.4rem 0; }
    a { color: var(--accent); }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 0.5rem 0 2rem;
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .layout h2 {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      margin: 0 0 0.5rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    select, textarea, button {
      font: inherit;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    select, button { padding: 0.35rem 0.6rem; }
    button { cursor: pointer; }
    textarea {
      width: 100%;
      min-height: 22rem;
      padding: 0.75rem;
      resize: vertical;
      font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.4;
      /* Coding fonts ligate >= into ≥. The tag closer and "=" in <mo>…=</mo> are those two characters. */
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
    }
    #preview {
      min-height: 22rem;
      padding: 1rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: auto;
      font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", "Asana Math", serif;
      font-size: 1.35rem;
    }
    #preview:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    #preview > * { margin: 0.6rem 0; }
    #message {
      min-height: 1.4em;
      color: var(--muted);
      margin: 0.5rem 0 0;
    }
    #message.error { color: #a32020; }
    @media (prefers-color-scheme: dark) {
      #message.error { color: #ff8a80; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MathML polyfill demo</h1>
    <p>
      Type or paste MathML. The preview is rendered with
      <a href="./all-polyfills.js">all-polyfills.js</a>.
      Content that is not already inside <code>&lt;math&gt;</code> is wrapped for you.
    </p>
  </header>
  <main class="layout">
    <section>
      <div class="controls">
        <label for="examples">Examples</label>
        <select id="examples">
          <option value="">Choose an example…</option>
        </select>
      </div>
      <h2 id="source-heading">MathML</h2>
      <textarea id="source" aria-labelledby="source-heading" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <mrow>
    <mi mathvariant="double-struck">C</mi>
    <mo>=</mo>
    <mfenced open="{" close="}" separators=",">
      <mfrac bevelled="true">
        <mn>1</mn>
        <mi>z</mi>
      </mfrac>
      <mn>2</mn>
    </mfenced>
  </mrow>
</math>
</textarea>
      <p id="message" role="status"></p>
    </section>
    <section>
      <h2 id="preview-label">Rendered</h2>
      <div id="preview" tabindex="0" role="region" aria-labelledby="preview-label"></div>
    </section>
  </main>
  <script type="module">
    import { _MathTransforms } from './all-polyfills.js';

    document.head.appendChild(_MathTransforms.getCSSStyleSheet());

    const MATH_NS = 'http://www.w3.org/1998/Math/MathML';
    const DROP_TAGS = new Set(['script', 'iframe', 'object', 'embed', 'link', 'meta', 'base', 'style']);

    const EXAMPLES = [
      {
        label: 'Fences, variant, bevelled fraction',
        source: `<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <mrow>
    <mi mathvariant="double-struck">C</mi>
    <mo>=</mo>
    <mfenced open="{" close="}" separators=",">
      <mfrac bevelled="true">
        <mn>1</mn>
        <mi>z</mi>
      </mfrac>
      <mn>2</mn>
    </mfenced>
  </mrow>
</math>`
      },
      {
        label: 'menclose',
        source: `<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <menclose notation="circle box">
    <mi>x</mi>
    <mo>+</mo>
    <mn>1</mn>
  </menclose>
</math>`
      },
      {
        label: 'maction toggle (click the expression)',
        source: `<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <maction actiontype="toggle">
    <mrow>
      <mi>x</mi>
      <mo>+</mo>
      <mn>1</mn>
    </mrow>
    <mrow>
      <mi>y</mi>
      <mo>−</mo>
      <mn>2</mn>
    </mrow>
  </maction>
</math>`
      },
      {
        label: 'maction tooltip (hover the expression)',
        source: `<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <maction actiontype="tooltip">
    <mi>x</mi>
    <mrow>
      <mi>x</mi>
      <mo>+</mo>
      <mn>1</mn>
    </mrow>
  </maction>
</math>`
      },
      {
        label: 'Elementary math (multiplication)',
        source: `<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <mstack>
    <msgroup>
      <mn>123</mn>
      <msrow><mo>×</mo><mn>321</mn></msrow>
    </msgroup>
    <msline/>
    <msgroup shift="1">
      <mn>123</mn>
      <mn>246</mn>
      <mn>369</mn>
    </msgroup>
    <msline/>
  </mstack>
</math>`
      },
      {
        label: 'Elementary math (Subtraction with borrow)',
        source: `<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <mstack>
    <mscarries crossout="updiagonalstrike">
      <mn>2</mn>
      <mn>12</mn>
      <none/>
    </mscarries>
    <mn>2,327</mn>
    <msrow><mo>−</mo><mn>1,156</mn></msrow>
    <msline/>
    <mn>1,171</mn>
  </mstack>
</math>`
      },
      {
        label: 'Elementary math (Long division)',
        source: `<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <mlongdiv longdivstyle="lefttop">
    <mn>3</mn>
    <mn>435.3</mn>
    <mn>1306</mn>
    <msgroup position="2" shift="-1">
      <msgroup>
        <mn>12</mn>
        <msline length="2"/>
      </msgroup>
      <msgroup>
        <mn>10</mn>
        <mn>9</mn>
        <msline length="2"/>
      </msgroup>
      <msgroup>
        <mn>16</mn>
        <mn>15</mn>
        <msline length="2"/>
        <mn>1.0</mn>
      </msgroup>
      <msgroup position="-1">
        <mn>9</mn>
        <msline length="3"/>
        <mn>1</mn>
      </msgroup>
    </msgroup>
  </mlongdiv>
</math>`
      },
      {
        label: 'Linebreaking with indentation',
        source: `<math xmlns="http://www.w3.org/1998/Math/MathML" display="block" maxwidth="30em">
  <mrow>
    <mrow>
      <mi>f</mi>
      <mo>&#x2061;</mo>
      <mo>(</mo>
      <mi>x</mi>
      <mo>)</mo>
    </mrow>
    <mo id="eq1-equals">=</mo>
    <mrow>
      <msup>
        <mrow>
          <mo>(</mo>
          <mi>x</mi>
          <mo>+</mo>
          <mn>1</mn>
          <mo>)</mo>
        </mrow>
        <mn>4</mn>
      </msup>
      <mo linebreak="newline" linebreakstyle="before" indentalign="id" indenttarget="eq1-equals">=</mo>
      <msup><mi>x</mi><mn>4</mn></msup>
      <mo id="eq1-plus">+</mo>
      <mrow>
        <mn>4</mn>
        <mo>&#x2062;</mo>
        <msup><mi>x</mi><mn>3</mn></msup>
      </mrow>
      <mo>+</mo>
      <mrow>
        <mn>6</mn>
        <mo>&#x2062;</mo>
        <msup><mi>x</mi><mn>2</mn></msup>
      </mrow>
      <mo linebreak="newline" linebreakstyle="before" indentalignlast="id" indenttarget="eq1-plus">+</mo>
      <mrow>
        <mn>4</mn>
        <mo>&#x2062;</mo>
        <mi>x</mi>
      </mrow>
      <mo>+</mo>
      <mn>1</mn>
    </mrow>
  </mrow>
</math>`
      },
      {
        label: 'maligngroup alignment',
        source: `<math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
  <mtable groupalign="{decimalpoint left left decimalpoint left left decimalpoint}">
    <mtr>
      <mtd>
        <mrow>
          <mrow>
            <mrow>
              <maligngroup/>
              <mn>8.44</mn>
              <mo>&#x2062;</mo>
              <maligngroup/>
              <mi>x</mi>
            </mrow>
            <maligngroup/>
            <mo>+</mo>
            <mrow>
              <maligngroup/>
              <mn>55</mn>
              <mo>&#x2062;</mo>
              <maligngroup/>
              <mi>y</mi>
            </mrow>
          </mrow>
          <maligngroup/>
          <mo>=</mo>
          <maligngroup/>
          <mn>0</mn>
        </mrow>
      </mtd>
    </mtr>
    <mtr>
      <mtd>
        <mrow>
          <mrow>
            <mrow>
              <maligngroup/>
              <mn>3.1</mn>
              <mo>&#x2062;</mo>
              <maligngroup/>
              <mi>x</mi>
            </mrow>
            <maligngroup/>
            <mo>−</mo>
            <mrow>
              <maligngroup/>
              <mn>0.7</mn>
              <mo>&#x2062;</mo>
              <maligngroup/>
              <mi>y</mi>
            </mrow>
          </mrow>
          <maligngroup/>
          <mo>=</mo>
          <maligngroup/>
          <mrow><mo>−</mo><mn>1.1</mn></mrow>
        </mrow>
      </mtd>
    </mtr>
  </mtable>
</math>`
      },
      {
        label: 'mtable (rowalign, frame and lines)',
        source: `<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <mtable rowalign='baseline' frame="solid" rowlines="solid" columnlines="solid" columnspacing="1em">
    <mtr>
      <mtd><mi>a</mi></mtd>
      <mtd><mi>b</mi></mtd>
      <mtd><mi>c</mi></mtd>
    </mtr>
    <mtr>
      <mtd><mn>1</mn></mtd>
      <mtd><mn>2</mn></mtd>
      <mtd><mn>3</mn></mtd>
    </mtr>
    <mtr>
      <mtd><mfrac><mn>1</mn><mn>2</mn></mfrac></mtd>
      <mtd><mi>x</mi></mtd>
      <mtd><msup><mi>y</mi><mn>2</mn></msup></mtd>
    </mtr>
  </mtable>
</math>`
      },
      {
        label: 'mpadded',
        source: `<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <mrow>
    <mpadded voffset="+1height">
      <mn>1</mn>
    </mpadded>
    <mo>+</mo>
    <mpadded lspace="1em" width="+2em">
      <mi>y</mi>
    </mpadded>
  </mrow>
</math>`
      },
      {
        label: 'scriptshift',
        source: `<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
  <mrow>
    <msub subscriptshift="0.5em">
      <mi>x</mi>
      <mn>0</mn>
    </msub>
    <mo>+</mo>
    <msup superscriptshift="0.5em">
      <mi>x</mi>
      <mn>2</mn>
    </msup>
    <mo>+</mo>
    <msubsup subscriptshift="0.5em" superscriptshift="0.5em">
      <mo>&#x222B;</mo>
      <mn>0</mn>
      <mn>1</mn>
    </msubsup>
  </mrow>
</math>`
      }
    ];

    const source = document.getElementById('source');
    const preview = document.getElementById('preview');
    const message = document.getElementById('message');
    const examples = document.getElementById('examples');

    for (let i = 0; i < EXAMPLES.length; i++) {
      const option = document.createElement('option');
      option.value = String(i);
      option.textContent = EXAMPLES[i].label;
      examples.appendChild(option);
    }

    /**
     * @param {Element} root
     */
    function sanitize(root) {
      for (const el of [root, ...root.querySelectorAll('*')]) {
        if (DROP_TAGS.has(el.localName)) {
          el.remove();
          continue;
        }
        for (const attr of [...el.attributes]) {
          const name = attr.name.toLowerCase();
          const unsafeUrl = (name === 'href' || name === 'src' || name === 'xlink:href')
            && /^\s*(javascript|vbscript):/i.test(attr.value);
          if (name.startsWith('on') || unsafeUrl) el.removeAttribute(attr.name);
        }
      }
    }

    /**
     * Top-level math elements only, so a nested math is not inserted twice.
     * @param {Element[]} nodes
     * @returns {Element[]}
     */
    function topLevelMath(nodes) {
      return nodes.filter((el) => {
        let parent = el.parentElement;
        while (parent) {
          if (parent.localName === 'math') return false;
          parent = parent.parentElement;
        }
        return true;
      });
    }

    /**
     * @param {string} raw
     * @returns {Element[]}
     */
    function extractMath(raw) {
      let text = raw.trim().replace(/^\uFEFF/, '');
      text = text.replace(/^\s*<\?xml[\s\S]*?\?>/, '').trim();
      if (!text) return [];
      if (!/<\s*(?:[\w.-]+:)?math(\s|\/|>)/i.test(text)) {
        text = `<math xmlns="${MATH_NS}" display="block">${text}</math>`;
      }

      if (text.startsWith('<')) {
        const xml = new DOMParser().parseFromString(text, 'application/xml');
        if (!xml.querySelector('parsererror')) {
          const namespaced = topLevelMath([...xml.getElementsByTagNameNS(MATH_NS, 'math')]);
          if (namespaced.length) return namespaced;
        }
      }

      const html = new DOMParser().parseFromString(text, 'text/html');
      return topLevelMath([...html.querySelectorAll('math')]);
    }

    function render() {
      preview.replaceChildren();
      message.classList.remove('error');
      const maths = extractMath(source.value);
      if (!source.value.trim()) {
        message.textContent = 'Paste MathML to render it.';
        return;
      }
      if (!maths.length) {
        message.textContent = 'No MathML found.';
        message.classList.add('error');
        return;
      }

      for (const math of maths) {
        sanitize(math);
        preview.appendChild(document.importNode(math, true));
      }

      try {
        // Transform the container so selectors such as "math" match the pasted
        // elements. That is the same path as the acid-test "Apply Transform" button.
        _MathTransforms.transform(preview);
      } catch (err) {
        message.textContent = err instanceof Error ? err.message : 'The polyfills could not render this MathML.';
        message.classList.add('error');
        return;
      }

      const count = maths.length;
      message.textContent = count === 1
        ? 'Rendered with all polyfills.'
        : `Rendered ${count} expressions with all polyfills.`;
    }

    let timer = 0;
    source.addEventListener('input', () => {
      window.clearTimeout(timer);
      timer = window.setTimeout(render, 120);
    });
    examples.addEventListener('change', () => {
      const example = EXAMPLES[Number(examples.value)];
      if (!example) return;
      source.value = example.source;
      render();
    });

    render();
  </script>
</body>
</html>
